<!DOCTYPE html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0e17">
<title>QT · Quotient Tracker</title>
<style>
:root{--bg:#0a0e17;--card:#131a28;--card2:#1a2335;--tx:#eef3fb;--mut:#8696b0;--ac:#3b9cff;--ac2:#6cc1ff;--ln:#222d44;--glow:0 0 18px rgba(59,156,255,.45);--ok:#34d6a0;--warn:#ffb454;--bad:#ff6b7a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=light]{--bg:#f2f6fc;--card:#fff;--card2:#eaf1fb;--tx:#101a2b;--mut:#667a99;--ln:#dbe5f3;--glow:0 4px 16px rgba(59,156,255,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:pan-x pan-y}input,textarea,select{font-size:16px}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;transition:background .4s,color .4s}
#app{max-width:560px;margin:0 auto;padding:18px 16px 110px}
h1{font-size:26px;margin:4px 0 2px;letter-spacing:-.5px}h2{font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;margin:22px 0 8px;font-weight:600}
.sub{color:var(--mut);font-size:13px}
#v{animation:up .38s cubic-bezier(.22,.8,.3,1)}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:14px;margin-bottom:10px;transition:transform .25s ease,background .3s}
.row{display:flex;align-items:center;gap:10px}.sp{flex:1;min-width:0}
.t{font-weight:600}.m{color:var(--mut);font-size:12.5px}
.btn{border:0;border-radius:14px;padding:11px 16px;font:inherit;font-weight:600;color:#fff;background:linear-gradient(135deg,#2b86ff,#58b6ff);box-shadow:var(--glow);cursor:pointer;transition:transform .2s ease,box-shadow .3s}
.btn:active{transform:scale(.96)}.btn.g{background:var(--card2);color:var(--tx);box-shadow:none}.btn.s{padding:8px 12px;font-size:13px;border-radius:12px}.btn.d{background:rgba(255,107,122,.15);color:var(--bad);box-shadow:none}
.pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11.5px;font-weight:600;background:rgba(59,156,255,.15);color:var(--ac2)}
.pill.w{background:rgba(255,180,84,.16);color:var(--warn)}.pill.b{background:rgba(255,107,122,.16);color:var(--bad)}.pill.o{background:rgba(52,214,160,.16);color:var(--ok)}
.ban{background:linear-gradient(135deg,rgba(43,134,255,.25),rgba(88,182,255,.12));border:1px solid rgba(59,156,255,.4);box-shadow:var(--glow)}
input,select,textarea{width:100%;background:var(--card2);color:var(--tx);border:1px solid var(--ln);border-radius:12px;padding:11px 12px;font:inherit;outline:0;transition:border .2s,box-shadow .25s}
input:focus,select:focus,textarea:focus{border-color:var(--ac);box-shadow:var(--glow)}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg{display:flex;background:var(--card2);border-radius:14px;padding:4px;margin-bottom:12px;position:relative}
.seg button{flex:1;border:0;background:none;color:var(--mut);padding:9px;font:inherit;font-weight:600;border-radius:11px;cursor:pointer;transition:all .3s}
.seg button.on{background:var(--card);color:var(--tx);box-shadow:0 2px 10px rgba(0,0,0,.2)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .h{font-size:11px;color:var(--mut);padding:4px 0}
.cal .c{aspect-ratio:1;border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-size:14px;transition:background .25s,transform .2s;position:relative}
.cal .c:active{transform:scale(.92)}.cal .c.td{border:1px solid var(--ac)}.cal .c.sel{background:var(--ac);color:#fff;box-shadow:var(--glow)}
.cal .n{font-size:10px;font-weight:700;color:var(--ac2);line-height:1}.cal .sel .n{color:#fff}
.rates{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.rates button{border:1px solid var(--ln);background:var(--card2);color:var(--tx);border-radius:12px;padding:10px 0;font:inherit;cursor:pointer;transition:all .25s}
.rates button.on{background:var(--ac);color:#fff;box-shadow:var(--glow);border-color:transparent}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(520px,calc(100% - 24px));background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--ln);border-radius:24px;display:flex;padding:6px;z-index:5;box-shadow:0 10px 30px rgba(0,0,0,.25)}
nav i{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/5);border-radius:18px;background:linear-gradient(135deg,#2b86ff,#58b6ff);box-shadow:var(--glow);transition:transform .45s cubic-bezier(.3,.9,.3,1)}
nav button{flex:1;position:relative;border:0;background:none;color:var(--mut);padding:9px 0 7px;font:inherit;font-size:10.5px;font-weight:600;cursor:pointer;transition:color .3s}
nav button b{display:block;font-size:18px;line-height:1.1;font-weight:400}nav button.on{color:#fff}
#sh{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .3s;z-index:9;display:flex;align-items:flex-end;justify-content:center}
#sh.open{opacity:1;pointer-events:auto}
#sb{width:100%;max-width:560px;max-height:88%;overflow:auto;background:var(--bg);border-radius:26px 26px 0 0;padding:20px 16px calc(24px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .4s cubic-bezier(.22,.8,.3,1)}
#sh.open #sb{transform:none}
.sw{width:46px;height:28px;border-radius:99px;background:var(--card2);position:relative;border:0;cursor:pointer;transition:background .3s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .3s}
.sw.on{background:var(--ac);box-shadow:var(--glow)}.sw.on::after{transform:translateX(18px)}
.empty{text-align:center;color:var(--mut);padding:26px 10px}
.eb{font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--ac2);text-transform:uppercase}.hero{background:linear-gradient(135deg,rgba(43,134,255,.24),var(--card));border-radius:24px;padding:18px;margin:14px 0 10px;border:1px solid var(--ln);box-shadow:var(--glow)}.big{font-size:46px;font-weight:700;letter-spacing:-1px;line-height:1.1;margin:6px 0}.bar{height:8px;border-radius:9px;background:var(--card2);overflow:hidden;margin-top:12px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#2b86ff,#6cc1ff);border-radius:9px;animation:gw .9s cubic-bezier(.22,.8,.3,1)}@keyframes gw{from{width:0}}.st{display:grid;grid-template-columns:1fr 1fr;gap:10px}.st .card{margin:0}.st b{display:block;font-size:34px;line-height:1.1;margin:8px 0 2px}.cal2{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}.cal2 .h{font-size:11px;color:var(--mut);padding:4px 0}.cal2 .c{min-height:58px;border-radius:15px;background:var(--card2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;font-weight:600;font-size:14px;border:1px solid transparent;transition:background .25s,transform .2s,box-shadow .3s}.cal2 .c:active{transform:scale(.93)}.cal2 .c.o{opacity:.28;pointer-events:none;font-weight:400}.cal2 .c.td{border-color:var(--ac)}.cal2 .c.sel{background:rgba(59,156,255,.22);box-shadow:var(--glow);border-color:var(--ac)}.cal2 .c i{width:6px;height:6px;border-radius:50%;background:var(--ok)}.cal2 .c i.p{background:var(--warn)}.cal2 .c small{font-size:9.5px;font-weight:400;color:var(--mut);line-height:1}.lg{display:flex;gap:14px;font-size:12px;color:var(--mut);margin-top:12px}.lg span::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--ok)}.lg .p::before{background:var(--warn)}.lg .y::before{background:var(--ac)}.ds{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0 8px}.ds div{background:var(--card2);border-radius:13px;padding:10px 2px;text-align:center;font-size:11px;color:var(--mut)}.ds b{display:block;font-size:19px;margin-bottom:2px}.dh{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--mut);text-transform:uppercase;margin:20px 0 8px}.tag{font-size:10px;border:1px solid var(--warn);color:var(--warn);border-radius:99px;padding:1px 7px;margin-left:6px;font-weight:700;vertical-align:middle}.hd{width:44px;height:5px;border-radius:9px;background:var(--ln);margin:-8px auto 14px}#sb{will-change:transform;overscroll-behavior:contain}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div id="app"><div id="v"></div></div>
<nav id="nav"><i></i></nav>
<div id="sh"><div id="sb"></div></div>
<script>
const $=s=>document.querySelector(s),KEY='qt_v1',pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const P=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const add=(s,n)=>{const d=P(s);d.setDate(d.getDate()+n);return iso(d)};
const diff=(a,b)=>Math.round((P(a)-P(b))/864e5);
const TD=()=>iso(new Date()),uid=()=>Math.random().toString(36).slice(2,9);
const E=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const IV='1,3,7,14,30,60';
const def=()=>({subjects:[{id:'s1',name:'Physics',q:20,iv:IV,up:25,dn:20}],topics:[],log:[],tests:[],set:{lead:3,gap:7,theme:'dark'}});
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.subjects)S=def();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const sub=id=>S.subjects.find(s=>s.id===id)||{name:'(deleted)',q:20,iv:IV,up:25,dn:20};
const offs=t=>[0,...sub(t.sid).iv.split(',').map(Number).filter(n=>n>0)];
const dueOf=t=>{const o=offs(t);return t.stage<o.length?add(t.start,o[t.stage]):null};
function tasksOn(d){const td=TD(),r=[];S.topics.forEach(t=>{const o=offs(t);for(let k=t.stage;k<o.length;k++){const due=add(t.start,o[k]);if(due===d||(d===td&&k===t.stage&&due<td))r.push({t,k,due})}});return r}
const overdue=()=>S.topics.filter(t=>{const d=dueOf(t);return d&&d<TD()});
const MN=['January','February','March','April','May','June','July','August','September','October','November','December'];
const rel=d=>{const n=diff(d,TD());return n===0?'today':n===1?'tomorrow':n>1?'in '+n+' days':Math.abs(n)+'d overdue'};
let tab=0,hs=0,cm=new Date(),csel=TD(),rt=3,ctx=null,theme;
const TABS=[['◉','Today'],['▦','Calendar'],['✓','Tasks'],['◷','History'],['⚙','Settings']];
$('#nav').innerHTML+=TABS.map((t,i)=>`<button data-a="tab" data-i="${i}"><b>${t[0]}</b>${t[1]}</button>`).join('');
function setTheme(){setTimeout(nat,0);document.documentElement.dataset.theme=S.set.theme;document.querySelector('meta[name=theme-color]').content=S.set.theme==='dark'?'#0a0e17':'#f2f6fc'}
function taskCard(x,od){const t=x.t,o=offs(x.t);return`<div class="card"><div class="row"><div class="sp"><div class="t">${E(t.name)}</div><div class="m">${E(sub(t.sid).name)} · Revision ${x.k+1}/${o.length} · ${t.q} questions</div></div>${od?'<span class="pill b">'+rel(x.due)+'</span>':''}<button class="btn s" data-a="ci" data-id="${t.id}" data-k="${x.k}">Check-in</button></div></div>`}
function testBan(){const td=TD(),lead=+S.set.lead;return S.tests.filter(x=>!x.done&&diff(x.date,td)>=0&&diff(x.date,td)<=lead).sort((a,b)=>a.date<b.date?-1:1).map(x=>{const n=diff(x.date,td);return`<div class="card ban"><div class="row"><div class="sp"><div class="t">${n===0?'Chapter test today':'Test '+rel(x.date)}</div><div class="m">${E(x.ch)} · ${E(sub(x.sid).name)} · Round ${x.round}/3</div></div><button class="btn s" data-a="tdone" data-id="${x.id}">Done</button></div></div>`}).join('')}
function vToday(){const td=TD(),l=tasksOn(td),od=l.filter(x=>x.due<td).length;const up=S.tests.filter(x=>!x.done&&diff(x.date,td)>lead()).sort((a,b)=>a.date<b.date?-1:1).slice(0,6);
return`<div class="row"><div class="sp"><h1>Today</h1><div class="sub">${P(td).toDateString()}</div></div><button class="btn" data-a="nt">+ New task</button></div>${testBan()}<h2>To do · ${l.length}${od?' · '+od+' overdue':''}</h2>${l.length?l.map(x=>taskCard(x,x.due<td)).join(''):'<div class="card empty">Nothing due. Add a topic to start your revision trail.</div>'}<h2>Upcoming tests</h2>${up.length?up.map(x=>`<div class="card row"><div class="sp"><div class="t">${E(x.ch)}</div><div class="m">${E(sub(x.sid).name)} · Round ${x.round}/3 · ${x.date}</div></div><span class="pill">${rel(x.date)}</span></div>`).join(''):'<div class="m">No upcoming tests.</div>'}<div style="margin-top:10px"><button class="btn g s" data-a="ntest">+ Chapter test</button></div>`}
const lead=()=>+S.set.lead;
function vCal(){const y=cm.getFullYear(),m=cm.getMonth(),f=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate(),td=TD();let c=['S','M','T','W','T','F','S'].map(x=>`<div class="h">${x}</div>`).join('')+'<div></div>'.repeat(f);
for(let i=1;i<=n;i++){const d=y+'-'+pad(m+1)+'-'+pad(i),k=tasksOn(d).length+S.tests.filter(x=>!x.done&&x.date===d).length;c+=`<div class="c${d===td?' td':''}${d===csel?' sel':''}" data-a="day" data-d="${d}">${i}<span class="n">${k||'&nbsp;'}</span></div>`}
const l=tasksOn(csel),ts=S.tests.filter(x=>!x.done&&x.date===csel);
return`<h1>Calendar</h1><div class="card"><div class="row" style="margin-bottom:10px"><button class="btn g s" data-a="mo" data-n="-1">‹</button><div class="sp t" style="text-align:center">${MN[m]} ${y}</div><button class="btn g s" data-a="mo" data-n="1">›</button></div><div class="cal">${c}</div></div><h2>${csel}</h2>${ts.map(x=>`<div class="card ban t">Test: ${E(x.ch)} · Round ${x.round}/3</div>`).join('')}${l.length?l.map(x=>taskCard(x,x.due<TD())).join(''):'<div class="m">No tasks this day.</div>'}`}
function vTasks(){return`<div class="row"><div class="sp"><h1>Tasks</h1><div class="sub">${S.topics.length} topics</div></div><button class="btn" data-a="nt">+ New</button></div><h2>Topics</h2>${S.topics.length?S.topics.map(t=>{const o=offs(t),d=dueOf(t);return`<div class="card"><div class="row"><div class="sp"><div class="t">${E(t.name)}</div><div class="m">${E(sub(t.sid).name)} · ${t.q} questions · ${d?'Next '+d+' ('+rel(d)+')':'All revisions complete'}</div></div><span class="pill ${d?'':'o'}">${t.stage}/${o.length}</span><button class="btn d s" data-a="dt" data-id="${t.id}">✕</button></div></div>`}).join(''):'<div class="card empty">No topics yet.</div>'}<h2>Chapter tests</h2>${S.tests.length?S.tests.slice().sort((a,b)=>a.date<b.date?-1:1).map(x=>`<div class="card row"><div class="sp"><div class="t">${E(x.ch)}</div><div class="m">${E(sub(x.sid).name)} · Round ${x.round}/3 · ${x.date}</div></div>${x.done?'<span class="pill o">Done</span>':'<span class="pill">'+rel(x.date)+'</span>'}<button class="btn d s" data-a="dtest" data-id="${x.id}">✕</button></div>`).join(''):'<div class="m">None scheduled.</div>'}`}
function vHist(){let h=`<h1>History</h1><div class="seg"><button data-a="hs" data-i="0" class="${hs?'':'on'}">Done</button><button data-a="hs" data-i="1" class="${hs?'on':''}">Undone</button></div>`;
if(hs){const o=overdue();return h+(o.length?o.map(t=>`<div class="card"><div class="row"><div class="sp"><div class="t">${E(t.name)}</div><div class="m">${E(sub(t.sid).name)} · due ${dueOf(t)}</div></div><span class="pill b">${rel(dueOf(t))}</span><button class="btn s" data-a="ci" data-id="${t.id}" data-k="${t.stage}">Do now</button></div></div>`).join(''):'<div class="card empty">Nothing missed. Great work.</div>')}
if(!S.log.length)return h+'<div class="card empty">No completed check-ins yet.</div>';const g={};S.log.forEach(x=>(g[x.d]=g[x.d]||[]).push(x));
return h+Object.keys(g).sort().reverse().map(d=>`<h2>${d}</h2>`+g[d].map(x=>`<div class="card"><div class="row"><div class="sp"><div class="t">${E(x.name)}</div><div class="m">Revision ${x.k+1} · ${x.c}/${x.q} correct · ${Math.round(x.c/Math.max(1,x.q)*100)}%</div></div><span class="pill ${x.r<=2?'b':x.r>=4?'o':'w'}">${['','Very hard','Hard','Moderate','Easy','Very easy'][x.r]}</span></div></div>`).join('')).join('')}
function vSet(){const st=S.set;return`<h1>Settings</h1><h2>General</h2><div class="card"><div class="row"><div class="sp t">Light theme</div><button class="sw ${st.theme==='light'?'on':''}" data-a="theme"></button></div><div class="g2"><div><label>Test reminder (days before)</label><input type="number" min="0" data-g="lead" value="${st.lead}"></div><div><label>Gap between test rounds (days)</label><input type="number" min="1" data-g="gap" value="${st.gap}"></div></div></div><h2>Subjects</h2>${S.subjects.map(s=>`<div class="card"><label>Name</label><input data-s="${s.id}" data-k="name" value="${E(s.name)}"><div class="g2"><div><label>Default questions</label><input type="number" min="1" data-s="${s.id}" data-k="q" value="${s.q}"></div><div><label>Revision days</label><input data-s="${s.id}" data-k="iv" value="${E(s.iv)}"></div><div><label>Increase if hard (%)</label><input type="number" min="0" data-s="${s.id}" data-k="up" value="${s.up}"></div><div><label>Decrease if easy (%)</label><input type="number" min="0" data-s="${s.id}" data-k="dn" value="${s.dn}"></div></div><button class="btn d s" style="margin-top:12px" data-a="ds" data-id="${s.id}">Delete subject</button></div>`).join('')}<button class="btn g" data-a="as">+ Add subject</button><h2>Data</h2><div class="g2"><button class="btn g" data-a="demo">Load demo data</button><button class="btn d" data-a="undemo">Delete demo data</button><button class="btn g" data-a="exp">Export JSON</button><button class="btn g" data-a="imp">Import JSON</button></div>`}
function render(){const v=$('#v');v.innerHTML=[vToday,vCal,vTasks,vHist,vSet][tab]();v.style.animation='none';void v.offsetWidth;v.style.animation='';
document.querySelectorAll('nav button').forEach((b,i)=>b.classList.toggle('on',i===tab));$('#nav i').style.transform=`translateX(${tab*100}%)`}
const sheet=h=>{$('#sb').innerHTML='<div class="hd"></div>'+h;$('#sh').classList.add('open')},close=()=>$('#sh').classList.remove('open');
const opts=()=>S.subjects.map(s=>`<option value="${s.id}">${E(s.name)}</option>`).join('');
function ntSheet(){if(!S.subjects.length)return sheet('<p>Add a subject in Settings first.</p>');sheet(`<h1>New task</h1><label>Subject</label><select id="f1">${opts()}</select><label>Topic name</label><input id="f2" placeholder="e.g. Rotational motion"><label>Chapter (optional)</label><input id="f5" placeholder="e.g. Mechanics"><div class="g2"><div><label>Start date</label><input id="f3" type="date" value="${TD()}"></div><div><label>Extra practice (%)</label><input id="f4" type="number" min="0" value="0" placeholder="0, 20, 30"></div></div><p class="m">Tip: set 20 or 30 for a topic you find hard.</p><button class="btn" style="width:100%" data-a="snt">Create</button>`)}
function ciSheet(t,k){const o=offs(t);rt=3;ctx={id:t.id,k};sheet(`<h1>Check-in</h1><div class="sub">${E(t.name)} · Revision ${k+1}/${o.length}</div><div class="g2"><div><label>Questions attempted</label><input id="f1" type="number" min="0" value="${t.q}"></div><div><label>Correct</label><input id="f2" type="number" min="0" value="0"></div></div><label>How was it?</label><div class="rates">${[1,2,3,4,5].map(i=>`<button data-a="rate" data-i="${i}" class="${i===3?'on':''}">${i}</button>`).join('')}</div><div class="row m" style="justify-content:space-between;margin:6px 2px 14px"><span>1 Very hard</span><span>5 Very easy</span></div><button class="btn" style="width:100%" data-a="sci">Save check-in</button>`)}
function demo(){undemo();const td=TD(),A=[['d1','Physics'],['d2','Chemistry'],['d3','Maths']];A.forEach(a=>S.subjects.push({id:a[0],name:a[1],q:20,iv:IV,up:25,dn:20,demo:1}));
[['d1','Laws of motion',-8],['d1','Thermodynamics',-2],['d2','Chemical bonding',-4],['d2','Equilibrium',0],['d3','Integration',-1],['d3','Matrices',-14]].forEach(x=>S.topics.push({id:uid(),sid:x[0],name:x[1],start:add(td,x[2]),stage:0,q:20,demo:1}));
S.topics.filter(t=>t.demo).forEach(t=>{const o=offs(t);while(t.stage<o.length&&add(t.start,o[t.stage])<add(td,-1)&&t.name!=='Matrices'){const c=10+Math.floor(Math.random()*10);S.log.push({d:add(t.start,o[t.stage]),tid:t.id,name:t.name,k:t.stage,q:20,c,w:Math.min(19-c,2+Math.floor(Math.random()*3)),s:1,r:3,demo:1});t.stage++}});
S.tests.push({id:uid(),sid:'d1',ch:'Kinematics',date:add(td,3),round:1,demo:1},{id:uid(),sid:'d2',ch:'Organic basics',date:td,round:2,demo:1},{id:uid(),sid:'d3',ch:'Calculus',date:add(td,12),round:1,demo:1})}
function undemo(){S.topics=S.topics.filter(x=>!x.demo);S.tests=S.tests.filter(x=>!x.demo);S.log=S.log.filter(x=>!x.demo);S.subjects=S.subjects.filter(x=>!x.demo)}
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(el&&el.id!=='sh'){act(el.dataset.a,el.dataset)}else if(e.target.id==='sh')close()});
function act(a,d){const f=i=>$('#f'+i)&&$('#f'+i).value;
if(a==='tab'){tab=+d.i;render();return}
if(a==='hs'){hs=+d.i;render();return}
if(a==='mo'){cm=new Date(cm.getFullYear(),cm.getMonth()+ +d.n,1);render();return}
if(a==='day'){csel=d.d;render();return}
if(a==='theme'){S.set.theme=S.set.theme==='dark'?'light':'dark';setTheme()}
else if(a==='nt')return ntSheet();
else if(a==='snt'){const n=f(2).trim();if(!n)return;const s=sub(f(1)),b=Math.max(0,+f(4)||0);S.topics.push({id:uid(),sid:s.id,name:n,ch:f(5).trim(),start:f(3)||TD(),stage:0,q:Math.max(3,Math.round(s.q*(1+b/100)))});close()}
else if(a==='ci'){const t=S.topics.find(x=>x.id===d.id);return t&&ciSheet(t,+d.k)}
else if(a==='rate'){rt=+d.i;document.querySelectorAll('.rates button').forEach((b,i)=>b.classList.toggle('on',i+1===rt));return}
else if(a==='sci'){const t=S.topics.find(x=>x.id===ctx.id);if(!t)return close();const q=Math.max(0,+f(1)||0),c=Math.min(q,Math.max(0,+f(2)||0)),w=Math.min(q-c,Math.max(0,+f(3)||0)),sk=Math.min(q-c-w,Math.max(0,+f(4)||0)),s=sub(t.sid),m={1:1+s.up/100,2:1+s.up/200,3:1,4:1-s.dn/200,5:1-s.dn/100}[rt];
S.log.push({d:TD(),tid:t.id,name:t.name,k:ctx.k,q,c,w,s:sk,u:q-c-w-sk,sn:s.name,ch:t.ch,r:rt,demo:t.demo});t.stage=ctx.k+1;t.q=Math.max(3,Math.round(t.q*m));close()}
else if(a==='dt'||a==='dtest'||a==='ds'){return confirmDel(a,d.id)}else if(a==='cdel'){const[k,id]=ctx.del;if(k==='dt')S.topics=S.topics.filter(x=>x.id!==id);else if(k==='dtest')S.tests=S.tests.filter(x=>x.id!==id);else S.subjects=S.subjects.filter(x=>x.id!==id);close()}else if(a==='x'){return close()}
else if(a==='ntest'){if(!S.subjects.length)return;return sheet(`<h1>Chapter test</h1><label>Subject</label><select id="f1">${opts()}</select><label>Chapter name</label><input id="f2"><label>Round 1 date</label><input id="f3" type="date" value="${add(TD(),7)}"><p class="m">Rounds 2 and 3 are added automatically using your gap setting.</p><button class="btn" style="width:100%" data-a="stest">Schedule</button>`)}
else if(a==='stest'){const n=f(2).trim();if(!n)return;for(let r=1;r<=3;r++)S.tests.push({id:uid(),sid:f(1),ch:n,date:add(f(3),(r-1)*(+S.set.gap||7)),round:r});close()}
else if(a==='tdone'){const x=S.tests.find(x=>x.id===d.id);if(x)x.done=1}
else if(a==='dtest'){S.tests=S.tests.filter(x=>x.id!==d.id)}
else if(a==='as'){S.subjects.push({id:uid(),name:'New subject',q:20,iv:IV,up:25,dn:20})}
else if(a==='ds'){S.subjects=S.subjects.filter(x=>x.id!==d.id)}
else if(a==='demo')demo();else if(a==='undemo')undemo();
else if(a==='exp')return sheet(`<h1>Export</h1><p class="m">Copy this text and save it as a .json file.</p><textarea id="f1" rows="9" readonly>${E(JSON.stringify(S))}</textarea><button class="btn" style="width:100%;margin-top:12px" data-a="cp">Copy</button>`);
else if(a==='cp'){const x=$('#f1');x.select();try{navigator.clipboard.writeText(x.value)}catch(e){document.execCommand&&document.execCommand('copy')}return}
else if(a==='imp')return sheet(`<h1>Import</h1><p class="m">Paste exported JSON. This replaces current data.</p><textarea id="f1" rows="9"></textarea><button class="btn" style="width:100%;margin-top:12px" data-a="simp">Load</button>`);
else if(a==='simp'){try{const x=JSON.parse(f(1));if(!x.subjects||!x.topics)throw 0;S=Object.assign(def(),x);S.set=Object.assign(def().set,x.set);setTheme();close()}catch(e){$('#f1').style.borderColor='var(--bad)';return}}
save();render()}
document.addEventListener('change',e=>{const i=e.target;if(i.dataset.g){S.set[i.dataset.g]=Math.max(0,+i.value||0)}else if(i.dataset.s){const s=S.subjects.find(x=>x.id===i.dataset.s),k=i.dataset.k;if(!s)return;s[k]=k==='name'?i.value.trim()||s.name:k==='iv'?(i.value.replace(/[^0-9,]/g,'')||IV):Math.max(0,+i.value||0)}else return;save()});
const R=x=>{const w=x.w!=null?x.w:Math.max(0,x.q-x.c),s=x.s||0;return{c:x.c,w,s,u:x.u!=null?x.u:Math.max(0,x.q-x.c-w-s)}};
const acc=L=>{let c=0,t=0;L.forEach(x=>{const r=R(x);c+=r.c;t+=r.c+r.w});return t?Math.round(c/t*100)+'%':'–'};
function histCard(x){const r=R(x),t=S.topics.find(z=>z.id===x.tid),o=t?offs(t):[],nx=t&&o[x.k+1]!=null?add(t.start,o[x.k+1]):'';return`<div class='card'><div class='row' style='align-items:flex-start'><div class='sp'><div class='t'>${E(x.name)}${x.demo?'<span class=tag>DEMO</span>':''}</div><div class='m'>${E(x.sn||(t?sub(t.sid).name:''))}${x.ch?' · '+E(x.ch):''} · ${x.q} questions · ${acc([x])} accuracy</div></div><span class='pill o'>Done</span></div><div class='ds'><div><b style='color:var(--ok)'>${r.c}</b>Correct</div><div><b style='color:var(--bad)'>${r.w}</b>Wrong</div><div><b style='color:var(--warn)'>${r.s}</b>Skipped</div><div><b>${r.u}</b>Unattempted</div></div><div class='m'>${nx?'Next revision: '+nx:'All revisions complete'}</div></div>`}
function confirmDel(a,id){const nm=a==='dt'?(S.topics.find(x=>x.id===id)||{}).name:a==='dtest'?(S.tests.find(x=>x.id===id)||{}).ch:sub(id).name;ctx={del:[a,id]};sheet(`<h1>Delete?</h1><p class='m'>${E(nm||'This item')} will be removed. This can’t be undone.</p><div class='g2'><button class='btn g' data-a='x'>Cancel</button><button class='btn d' data-a='cdel'>Delete</button></div>`)}
function vToday(){const td=TD(),l=tasksOn(td),od=l.filter(x=>x.due<td).length,dn=S.log.filter(x=>x.d===td).length,qs=l.reduce((a,x)=>a+x.t.q,0),pc=dn+l.length?Math.round(dn/(dn+l.length)*100):0,up=S.tests.filter(x=>!x.done&&diff(x.date,td)>lead()).sort((a,b)=>a.date<b.date?-1:1).slice(0,6);
return`<div class='eb'>A fresh start</div><h1>Today, made focused.</h1><div class='sub'>${P(td).toDateString()}</div><button class='btn' style='width:100%;margin-top:12px' data-a='nt'>+ New task</button>${testBan()}<div class='hero'><div class='m'>Questions in your active plan</div><div class='big'>${qs}</div><div class='m'>${l.length} topics due · ${dn} completed today${od?' · '+od+' overdue':''}</div><div class='bar'><i style='width:${pc}%'></i></div></div><div class='st'><div class='card'><div class='m'>To practise</div><b>${l.length}</b><div class='m'>topics waiting</div></div><div class='card'><div class='m'>Accuracy</div><b>${acc(S.log)}</b><div class='m'>correct / attempted</div></div></div><h2>To do</h2>${l.length?l.map(x=>taskCard(x,x.due<td)).join(''):'<div class="card empty">Nothing due. Add a topic to start your revision trail.</div>'}<h2>Upcoming tests</h2>${up.length?up.map(x=>`<div class='card row'><div class='sp'><div class='t'>${E(x.ch)}</div><div class='m'>${E(sub(x.sid).name)} · Round ${x.round}/3 · ${x.date}</div></div><span class='pill'>${rel(x.date)}</span></div>`).join(''):'<div class=m>No upcoming tests.</div>'}<div style='margin-top:10px'><button class='btn g s' data-a='ntest'>+ Chapter test</button></div>`}
function vCal(){const y=cm.getFullYear(),m=cm.getMonth(),f=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate(),dim=new Date(y,m,0).getDate(),td=TD();let c=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div class='h'>${x}</div>`).join('');
for(let i=f-1;i>=0;i--)c+=`<div class='c o'>${dim-i}</div>`;
for(let i=1;i<=n;i++){const d=y+'-'+pad(m+1)+'-'+pad(i),p=tasksOn(d).length+S.tests.filter(x=>!x.done&&x.date===d).length,q=S.log.filter(x=>x.d===d).length,k=p+q;c+=`<div class='c${d===td?' td':''}${d===csel?' sel':''}' data-a='day' data-d='${d}'>${i}${k?`<i class='${p?'p':''}'></i><small>${k} task${k>1?'s':''}</small>`:''}</div>`}
for(let i=1;i<=(7-(f+n)%7)%7;i++)c+=`<div class='c o'>${i}</div>`;
const l=tasksOn(csel),ts=S.tests.filter(x=>!x.done&&x.date===csel),dl=S.log.filter(x=>x.d===csel);
return`<div class='eb'>Your practice rhythm</div><h1>Calendar</h1><div class='sub'>See what was planned, completed, or left for another day.</div><div class='card' style='margin-top:14px'><div class='row' style='margin-bottom:12px'><div class='sp t' style='font-size:19px'>${MN[m]} ${y}</div><button class='btn g s' data-a='mo' data-n='-1'>‹</button><button class='btn g s' data-a='mo' data-n='1'>›</button></div><div class='cal2'>${c}</div><div class='lg'><span>Completed</span><span class='p'>Pending</span><span class='y'>Today</span></div></div><h2>${csel}</h2>${ts.map(x=>`<div class='card ban t'>Test: ${E(x.ch)} · Round ${x.round}/3</div>`).join('')}${l.map(x=>taskCard(x,x.due<TD())).join('')}${dl.map(histCard).join('')}${l.length+ts.length+dl.length?'':'<div class=m>Nothing on this day.</div>'}`}
function vHist(){const h=`<div class='eb'>Your journey</div><h1>History</h1><div class='seg' style='margin-top:12px'><button data-a='hs' data-i='0' class='${hs?'':'on'}'>Done</button><button data-a='hs' data-i='1' class='${hs?'on':''}'>Undone</button></div>`;
if(hs){const o=overdue();return h+(o.length?o.map(t=>`<div class='card'><div class='row'><div class='sp'><div class='t'>${E(t.name)}</div><div class='m'>${E(sub(t.sid).name)} · due ${dueOf(t)}</div></div><span class='pill b'>${rel(dueOf(t))}</span><button class='btn s' data-a='ci' data-id='${t.id}' data-k='${t.stage}'>Do now</button></div></div>`).join(''):'<div class="card empty">Nothing missed. Great work.</div>')}
if(!S.log.length)return h+'<div class="card empty">No completed check-ins yet.</div>';const g={};S.log.forEach(x=>(g[x.d]=g[x.d]||[]).push(x));
return h+Object.keys(g).sort().reverse().map(d=>`<div class='dh'>${P(d).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</div>`+g[d].map(histCard).join('')).join('')}
function ciSheet(t,k){const o=offs(t);rt=3;ctx={id:t.id,k};sheet(`<h1>Check-in</h1><div class='sub'>${E(t.name)} · Revision ${k+1}/${o.length}</div><div class='g2'><div><label>Total questions</label><input id='f1' type='number' min='0' value='${t.q}'></div><div><label>Correct</label><input id='f2' type='number' min='0' value='0'></div><div><label>Wrong</label><input id='f3' type='number' min='0' value='0'></div><div><label>Skipped</label><input id='f4' type='number' min='0' value='0'></div></div><label>How was it?</label><div class='rates'>${[1,2,3,4,5].map(i=>`<button data-a='rate' data-i='${i}' class='${i===3?'on':''}'>${i}</button>`).join('')}</div><div class='row m' style='justify-content:space-between;margin:6px 2px 14px'><span>1 Very hard</span><span>5 Very easy</span></div><button class='btn' style='width:100%' data-a='sci'>Save check-in</button>`)}
(()=>{const sb=$('#sb');let y0=0,dy=0,on=0,t0=0;sb.addEventListener('touchstart',e=>{on=sb.scrollTop<=0&&!e.target.closest('textarea');y0=e.touches[0].clientY;dy=0;t0=Date.now()},{passive:true});sb.addEventListener('touchmove',e=>{if(!on)return;dy=e.touches[0].clientY-y0;if(dy>0){e.preventDefault();sb.style.transition='none';sb.style.transform='translateY('+dy+'px)'}else{dy=0;sb.style.transform=''}},{passive:false});sb.addEventListener('touchend',()=>{if(!on||!dy)return;const v=dy/Math.max(1,Date.now()-t0);sb.style.transition='transform .38s cubic-bezier(.22,.8,.3,1)';if(dy>120||v>.6){sb.style.transform='translateY(100%)';close();setTimeout(()=>{sb.style.transform='';sb.style.transition=''},420)}else{sb.style.transform='';setTimeout(()=>{sb.style.transition=''},400)}dy=0;on=0})})();
let tx0=0;$('#v').addEventListener('touchstart',e=>{tx0=e.touches[0].clientX},{passive:true});$('#v').addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx0;if(tab===1&&Math.abs(dx)>70)act('mo',{n:dx<0?1:-1})},{passive:true});
['gesturestart','gesturechange','gestureend'].forEach(g=>document.addEventListener(g,e=>e.preventDefault()));
function nat(){try{const P=window.Capacitor&&Capacitor.Plugins;if(!P)return;const d=S.set.theme==='dark';P.StatusBar&&(P.StatusBar.setBackgroundColor({color:d?'#0a0e17':'#f2f6fc'}),P.StatusBar.setStyle({style:d?'DARK':'LIGHT'}))}catch(e){}}
try{const A=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.App;A&&A.addListener('backButton',()=>{if($('#sh').classList.contains('open'))close();else if(tab!==0){tab=0;render()}else A.exitApp()})}catch(e){}
setTheme();render();
</script></body></html>
